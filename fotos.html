<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotos del siniestro | Banco & Seguros Belltech</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{--brand:#111C24;--accent:#FF6418;--bg:#F2F2F2;--ink:#111C24;--muted:#555;--ok:#0E8A5F;--err:#C0392B}
  *{box-sizing:border-box}
  body{margin:0;font-family:Calibri,Carlito,"Open Sans",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  main{max-width:560px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-top:3px solid var(--accent);padding:22px;box-shadow:0 10px 30px rgba(17,28,36,.10)}
  h1{font:800 22px "Open Sans",Arial,sans-serif;margin:0 0 6px}
  p.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
  .elegir{display:block;border:2px dashed #ccc;padding:22px;text-align:center;cursor:pointer;font:700 15px "Open Sans",Arial,sans-serif;color:var(--brand)}
  .elegir:hover{border-color:var(--accent)}
  .elegir input{display:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .grid div{position:relative;aspect-ratio:1;background:#eee;overflow:hidden}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .grid span{position:absolute;left:0;right:0;bottom:0;background:rgba(17,28,36,.75);color:#fff;font-size:12px;padding:3px 6px}
  .row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  button{flex:1;min-width:150px;border:0;font-family:"Open Sans",Arial,sans-serif;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer}
  .ok{background:var(--accent);color:#fff}.ok:hover{background:#e5560f}
  .no{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{padding:14px;margin-top:6px;font-size:15px}
  .msg.good{background:#E6F6EF;color:var(--ok)} .msg.bad{background:#FBEAEA;color:var(--err)} .msg.info{background:#EEF0FF;color:var(--brand)}
  small.note{display:block;color:var(--muted);margin-top:14px;font-size:12.5px}
</style>
</head>
<body>
<header><img src="assets/logo_blanco.png" alt="Belltech" style="height:28px;display:block"><span style="display:flex;align-items:center;gap:8px;font:600 12px 'Open Sans',Arial;color:rgba(255,255,255,.6);border-left:1px solid rgba(255,255,255,.2);padding-left:12px">powered by <img src="assets/nice.png" alt="NiCE" style="height:15px"></span></header>
<main>
  <div class="card" id="card"><h1>Fotos del siniestro</h1><p class="sub">Cargando…</p></div>
  <small class="note">Banco &amp; Seguros Belltech · Demo de Belltech powered by NiCE. Entidad ficticia: no subas fotos con datos reales. <span style="opacity:.7">fotos v1</span></small>
</main>
<script>
// fotos v1 – subir fotos de un siniestro (API v6.28). Se achican en el navegador (máx. 1600 px, JPEG) antes de subirlas.
// "Listo, enviar" o "Cancelar": en los dos casos Sofía se entera (eventos fotos_recibidas / fotos_canceladas).
// Escape = Cancelar · 5 minutos sin actividad = se cancela sola (si ya había fotos subidas, se envían).
const API = (window.DEMO_CONFIG || {}).BYS_API_URL;
const token = new URLSearchParams(location.search).get('t') || '';
const card = document.getElementById('card');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let max = 6, subidas = 0, ocupado = false, cerrada = false, ultima = Date.now(), vigia = null, sin = '';
const post = b => fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ t: token }, b)) }).then(r => r.json());
function fin(clase, html) { cerrada = true; clearInterval(vigia); card.innerHTML = '<h1>Fotos del siniestro' + (sin ? ' ' + esc(sin) : '') + '</h1><div class="msg ' + clase + '">' + html + '</div>'; }
function pantalla() {
  card.innerHTML = '<h1>Fotos del siniestro ' + esc(sin) + '</h1><p class="sub">Subí hasta ' + max + ' fotos: los daños, la patente del otro vehículo, el lugar. Podés sacarlas con la cámara del celular.</p>' +
    '<label class="elegir" id="lblElegir">＋ Elegir o sacar fotos<input type="file" id="arch" accept="image/*" multiple></label><div class="grid" id="grid"></div>' +
    '<div class="row"><button class="ok" id="listo" disabled>Listo, enviar</button><button class="no" id="cancelar">Cancelar</button></div>';
  document.getElementById('arch').onchange = e => subir([...e.target.files]);
  document.getElementById('listo').onclick = () => terminar('fotos_listo');
  document.getElementById('cancelar').onclick = () => terminar('fotos_cancelar');
}
function achicar(file) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('no es una imagen')); };
    img.src = url;
  });
}
async function subir(files) {
  if (ocupado) return; ocupado = true; ultima = Date.now();
  const grid = document.getElementById('grid'), listo = document.getElementById('listo');
  for (const f of files) {
    if (subidas >= max) { alert('Ya subiste el máximo de ' + max + ' fotos.'); break; }
    const cel = document.createElement('div'); cel.innerHTML = '<span>Subiendo…</span>'; grid.appendChild(cel);
    try {
      const dataUrl = await achicar(f);
      cel.insertAdjacentHTML('afterbegin', '<img alt="">'); cel.querySelector('img').src = dataUrl;
      const r = await post({ accion: 'foto_subir', tipo: 'image/jpeg', nombre: f.name, datos: dataUrl.split(',')[1] });
      if (r.ok) { subidas = r.cantidad; cel.querySelector('span').textContent = 'Foto ' + subidas + ' ✓'; }
      else { cel.querySelector('span').textContent = r.resultado === 'MAXIMO' ? 'Máximo alcanzado' : 'No se pudo subir'; }
    } catch (e) { cel.querySelector('span').textContent = 'No se pudo subir'; }
    ultima = Date.now();
  }
  listo.disabled = subidas === 0; ocupado = false;
  document.getElementById('arch').value = '';
}
async function terminar(accion) {
  if (cerrada || ocupado) return;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  let r; try { r = await post({ accion }); } catch (e) { card.querySelectorAll('button').forEach(b => b.disabled = false); return alert('No pudimos conectarnos. Probá de nuevo.'); }
  if (r.resultado === 'RECIBIDAS') return fin('good', '<b>¡Listo! Recibimos ' + (r.cantidad === 1 ? 'la foto' : 'las ' + r.cantidad + ' fotos') + '.</b><br>Quedan agregadas a tu denuncia. Sofía ya se enteró.');
  if (r.resultado === 'CANCELADO') return fin('info', 'No subiste fotos. La denuncia sigue en curso; si después querés subirlas, pedile a Sofía un link nuevo. Sofía ya se enteró.');
  if (r.resultado === 'NO_PENDIENTE') return fin('info', 'Este link ya no está activo.');
  fin('bad', 'Hubo un problema (' + esc(r.resultado || r.error) + '). Pedile a Sofía un link nuevo.');
}
async function iniciar() {
  if (!API || !token) return fin('bad', 'El link no es válido.');
  let r; try { r = await post({ accion: 'fotos_estado' }); } catch (e) { return fin('bad', 'No pudimos conectarnos. Probá de nuevo en unos segundos.'); }
  if (!r.ok) return fin('bad', 'El link no es válido. Pedile a Sofía uno nuevo.');
  sin = r.siniestro || ''; max = r.max || 6; subidas = r.cantidad || 0;
  if (r.estado !== 'pendiente') return fin('info', { recibidas: 'Ya recibimos las fotos de este siniestro.', cancelado: 'Este link se canceló. Pedile a Sofía uno nuevo si querés subir fotos.', vencido: 'Este link venció. Pedile a Sofía uno nuevo.', reemplazado: 'Este link fue reemplazado por uno más nuevo: usá el último que te mandamos.' }[r.estado] || 'Este link ya no está activo.');
  pantalla(); if (subidas) document.getElementById('listo').disabled = false;
  ['click', 'keydown', 'touchstart', 'scroll', 'change'].forEach(ev => document.addEventListener(ev, () => { ultima = Date.now(); }, { passive: true }));
  vigia = setInterval(() => { if (!cerrada && !ocupado && Date.now() - ultima >= 5 * 60000) terminar(subidas ? 'fotos_listo' : 'fotos_cancelar'); }, 15000);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !cerrada && !ocupado) terminar(subidas ? 'fotos_listo' : 'fotos_cancelar'); });
iniciar();
</script>
</body>
</html>
