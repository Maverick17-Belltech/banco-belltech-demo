<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="marca.js"></script>
<title>Encuesta de satisfacción | Banco & Seguros Belltech</title>
<style>
  :root{--brand:#111C24;--accent:#FF6418;--bg:#F2F2F2;--ink:#111C24;--muted:#555;--ok:#0E8A5F;--err:#C0392B}
  *{box-sizing:border-box}
  body{margin:0;font-family:Calibri,Carlito,"Open Sans",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  main{max-width:560px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border-top:3px solid var(--accent);padding:22px;box-shadow:0 10px 30px rgba(17,28,36,.10)}
  h1{font:800 22px "Open Sans",Arial,sans-serif;margin:0 0 6px}
  p.sub{color:var(--muted);margin:0 0 8px;font-size:15px}
  .q{font:700 15px "Open Sans",Arial,sans-serif;margin:20px 0 10px}
  .q small{font-weight:400;color:#777}
  .stars{display:flex;gap:8px}
  .stars button{width:52px;height:52px;border:1.5px solid #ccc;background:#fff;font-size:28px;line-height:1;color:#bbb;cursor:pointer}
  .stars button.on{color:var(--accent);border-color:var(--accent)}
  .yn{display:flex;gap:10px}
  .yn button{flex:1;padding:12px;border:1.5px solid #ccc;background:#fff;font:700 15px "Open Sans",Arial,sans-serif;cursor:pointer;color:var(--brand)}
  .yn button.on{border-color:var(--accent);background:#FFF1EA}
  textarea{width:100%;padding:12px;font:inherit;font-size:15px;border:1px solid #ccc;resize:vertical}
  .row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .row button{flex:1;min-width:150px;border:0;font-family:"Open Sans",Arial,sans-serif;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer}
  .ok{background:var(--accent);color:#fff}.ok:hover{background:#e5560f}
  .ok:disabled{opacity:.5;cursor:not-allowed}
  .msg{padding:14px;margin-top:6px;font-size:15px}
  .msg.good{background:#E6F6EF;color:var(--ok)} .msg.bad{background:#FBEAEA;color:var(--err)} .msg.info{background:#EEF0FF;color:var(--brand)}
  .err{color:var(--err);font-size:14px;margin:10px 0 0;min-height:1em}
  small.note{display:block;color:var(--muted);margin-top:14px;font-size:12.5px}
</style>
</head>
<body>
<header><img src="assets/logo_blanco.png" alt="Belltech" style="height:28px;display:block"><span style="display:flex;align-items:center;gap:8px;font:600 12px 'Open Sans',Arial;color:rgba(255,255,255,.6);border-left:1px solid rgba(255,255,255,.2);padding-left:12px">powered by <img src="assets/nice.png" alt="NiCE" style="height:15px"></span></header>
<main>
  <div class="card" id="card"><h1>¿Cómo te atendimos?</h1><p class="sub">Cargando…</p></div>
  <small class="note">Banco &amp; Seguros Belltech · Demo de Belltech powered by NiCE. Entidad ficticia. <span style="opacity:.7">encuesta v2</span></small>
</main>
<script>
// encuesta v1 – encuesta de satisfacción por mail (API v6.43): satisfacción 1-5, ¿resolviste tu consulta? y comentario opcional.
// POST público con el token del mail: encuesta_estado y encuesta_responder (por: mail). Vence a las 24 h (parámetro encuesta_vence_horas).
const API = (window.DEMO_CONFIG || {}).BYS_API_URL;
const token = new URLSearchParams(location.search).get('t') || '';
const card = document.getElementById('card');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const post = b => fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ t: token }, b)) }).then(r => r.json());
let sat = 0, res = '', ocupado = false;
function fin(clase, html) { card.innerHTML = '<h1>¿Cómo te atendimos?</h1><div class="msg ' + clase + '">' + html + '</div>'; }
function pantalla(e) {
  card.innerHTML = '<h1>¿Cómo te atendimos?</h1><p class="sub">' + (e.nombre ? 'Hola ' + esc(e.nombre) + ', g' : 'G') + 'racias por comunicarte con Sofía por ' + (e.canal === 'Voz' ? 'teléfono' : 'chat') + ' el ' + esc(String(e.fecha || '').split(' ')[0]) + '. Son 3 preguntas.</p>' +
    '<p class="q">1. ¿Qué tan satisfecho quedaste con la atención?</p><div class="stars" id="stars">' + [1, 2, 3, 4, 5].map(n => '<button type="button" data-v="' + n + '" aria-label="' + n + ' de 5">★</button>').join('') + '</div>' +
    '<p class="q">2. ¿Resolviste tu consulta?</p><div class="yn" id="yn"><button type="button" data-v="si">Sí</button><button type="button" data-v="no">No</button></div>' +
    '<p class="q">3. ¿Querés dejarnos un comentario? <small>(opcional)</small></p><textarea id="com" rows="4" maxlength="500" placeholder="Contanos qué te pareció"></textarea>' +
    '<div class="row"><button class="ok" id="enviar" disabled>Enviar</button></div><p class="err" id="err"></p>';
  const listo = () => { document.getElementById('enviar').disabled = !(sat && res); };
  card.querySelectorAll('#stars button').forEach(x => x.onclick = () => { sat = Number(x.dataset.v); card.querySelectorAll('#stars button').forEach(y => y.classList.toggle('on', Number(y.dataset.v) <= sat)); listo(); });
  card.querySelectorAll('#yn button').forEach(x => x.onclick = () => { res = x.dataset.v; card.querySelectorAll('#yn button').forEach(y => y.classList.toggle('on', y === x)); listo(); });
  document.getElementById('enviar').onclick = enviar;
}
function enviar() {
  if (ocupado || !sat || !res) return; ocupado = true;
  const b = document.getElementById('enviar'); b.disabled = true; b.textContent = 'Enviando…'; document.getElementById('err').textContent = '';
  post({ accion: 'encuesta_responder', satisfaccion: sat, resuelto: res, comentario: (document.getElementById('com').value || '').trim(), por: 'mail' })
    .then(r => {
      if (r.ok) return fin('good', '¡Gracias por tu respuesta! Nos ayuda a mejorar la atención.');
      if (r.resultado === 'YA_RESPONDIDA') return fin('info', 'Esta encuesta ya fue respondida. ¡Gracias!');
      if (r.resultado === 'VENCIDA') return fin('bad', 'El link de esta encuesta venció.');
      throw new Error(r.resultado || r.error || 'error');
    })
    .catch(() => { ocupado = false; b.disabled = false; b.textContent = 'Enviar'; document.getElementById('err').textContent = 'No pudimos enviar la encuesta. Probá de nuevo en unos segundos.'; });
}
if (!API) fin('bad', 'Falta configurar BYS_API_URL en config.js.');
else if (token.length < 16) fin('bad', 'El link no es válido. Abrilo desde el mail que te mandamos.');
else post({ accion: 'encuesta_estado' }).then(e => {
  if (!e.ok) return fin('bad', 'No encontramos esta encuesta. Abrí el link desde el mail que te mandamos.');
  if (e.estado === 'respondida') return fin('info', 'Esta encuesta ya fue respondida. ¡Gracias!');
  if (e.estado === 'vencida') return fin('bad', 'El link de esta encuesta venció (dura ' + esc(e.vence_horas || 24) + ' horas).');
  pantalla(e);
}).catch(() => fin('bad', 'No pudimos cargar la encuesta. Probá de nuevo en unos minutos.'));
</script>
</body>
</html>
